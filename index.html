<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zorii</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Styles/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top Bar (Visible after auth) -->
    <header id="topbar" class="topbar hidden">
      <div class="brand" id="nav-home" title="Main Menu">
        <span class="brand-dot"></span>
        <span class="brand-name">Zorii</span>
      </div>
      <div class="user-badge" id="user-badge" title="Change Username & Color">
        <span class="status-dot" id="current-user-dot"></span>
        <span id="current-username"></span>
      </div>
    </header>

    <!-- 1. Auth View (Username + Color) -->
    <section id="view-auth" class="view active">
      <div class="center-card auth-card">
        <div class="logo-large">
          <span class="brand-dot-lg"></span>
          <h1>Zorii</h1>
        </div>
        <form id="form-auth" autocomplete="off">
          <input
            type="text"
            id="input-username"
            placeholder="Username"
            maxlength="20"
            required
            autofocus
          />
          <div id="color-picker" class="color-picker"></div>
          <button type="submit" class="btn-primary">Enter</button>
        </form>
      </div>
    </section>

    <!-- 2. Main Menu View -->
    <section id="view-menu" class="view">
      <div class="center-card menu-card">
        <div class="logo-large">
          <span class="brand-dot-lg"></span>
          <h1>Zorii</h1>
        </div>
        <div class="menu-actions">
          <button id="btn-go-join" class="btn-menu">
            <span class="btn-title">Join</span>
            <span class="btn-sub">Browse or enter room code</span>
          </button>
          <button id="btn-go-host" class="btn-menu btn-menu-accent">
            <span class="btn-title">Host</span>
            <span class="btn-sub">Host directly from your device</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 3. Join / Room Browser View -->
    <section id="view-join" class="view">
      <div class="panel-card">
        <div class="panel-header">
          <button class="btn-icon" data-back="view-menu" title="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <div class="search-wrap">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input
              type="text"
              id="input-search"
              placeholder="Search rooms or paste Room ID..."
              autocomplete="off"
            />
            <button id="btn-direct-join" class="btn-pill hidden">Connect</button>
          </div>
          <button id="btn-refresh-rooms" class="btn-icon" title="Refresh Registry">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          </button>
        </div>

        <div id="rooms-list" class="rooms-list"></div>
      </div>
    </section>

    <!-- 4. Host Room View -->
    <section id="view-host" class="view">
      <div class="center-card host-card">
        <div class="panel-header-simple">
          <button class="btn-icon" data-back="view-menu" title="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <h2>Host Room</h2>
        </div>
        <form id="form-host" autocomplete="off">
          <input
            type="text"
            id="host-name"
            placeholder="Room name"
            maxlength="32"
            required
          />
          <input
            type="text"
            id="host-desc"
            placeholder="Description"
            maxlength="80"
          />
          <div class="slider-row">
            <label for="host-max">Max members</label>
            <span id="host-max-val" class="mono-val">25</span>
          </div>
          <input
            type="range"
            id="host-max"
            min="5"
            max="100"
            value="25"
          />
          <button type="submit" class="btn-primary">Create</button>
        </form>
      </div>
    </section>

    <!-- 5. Room / Chat + Live Clicker View -->
    <section id="view-room" class="view">
      <div class="room-layout">
        <!-- Main Chat Screen -->
        <div class="chat-main">
          <div class="room-bar">
            <div class="room-meta">
              <div class="room-title-row">
                <h3 id="room-title"></h3>
                <span id="room-host-tag" class="host-pill">P2P Host</span>
              </div>
              <p id="room-desc"></p>
            </div>
            <div class="room-controls">
              <button id="btn-copy-code" class="btn-code" title="Copy Room ID">
                <span id="room-code-text"></span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button id="btn-leave-room" class="btn-icon btn-leave" title="Leave">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
              </button>
            </div>
          </div>

          <div id="chat-messages" class="chat-messages"></div>

          <form id="form-chat" class="chat-input-bar" autocomplete="off">
            <input
              type="text"
              id="input-chat"
              placeholder="Message..."
              maxlength="500"
            />
            <button type="submit" class="btn-send" title="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
        </div>

        <!-- Right Sidebar: Live Shared Clicker + Connected Users -->
        <aside class="users-sidebar">
          <div class="clicker-box">
            <button type="button" id="btn-room-clicker" class="btn-clicker">
              <span id="room-click-count" class="clicker-count">0</span>
              <span class="clicker-sub">Room Clicks</span>
            </button>
          </div>
          <div class="users-header">
            <span id="users-count">0 / 0</span>
          </div>
          <ul id="users-list" class="users-list"></ul>
        </aside>
      </div>
    </section>

    <!-- Minimal Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- PeerJS for WebRTC P2P Hosting + MQTT for decentralized room discovery -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="Values/config.js"></script>
  <script src="Scripts/p2p.js"></script>
  <script src="Scripts/app.js"></script>
</body>
</html>
